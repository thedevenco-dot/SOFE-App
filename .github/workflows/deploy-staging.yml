name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Staging Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @sofe/shared build

      - name: Run lint & format check
        run: |
          pnpm format:check
          pnpm lint

      - name: Run strict typechecking
        run: pnpm typecheck

      - name: Run test suites
        run: pnpm test
        env:
          NODE_ENV: test
          FIELD_ENCRYPTION_KEY: dGhpcy1pcy1hLXRlc3QtZW5jcnlwdGlvbi1rZXktMzJieXRlcz0=
          ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci-runs-32bytes-min
          JWT_SECRET: test-learner-jwt-secret-for-ci-runs-32b
          MONGODB_URI: mongodb://localhost:27017/sofe_test

  migrate-db:
    name: Run Database Migrations (Staging)
    runs-on: ubuntu-latest
    needs: [validate]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply MongoDB Index Migrations
        run: pnpm db:migrate
        env:
          NODE_ENV: staging
          APP_ENV: staging
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DB_NAME: sofe_staging

  deploy-api:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    needs: [migrate-db]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Staging API Deployment
        run: |
          if [ -n "${{ secrets.STAGING_API_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Staging API deploy hook..."
            curl -s -S -X POST "${{ secrets.STAGING_API_DEPLOY_HOOK_URL }}"
          else
            echo "STAGING_API_DEPLOY_HOOK_URL not configured; skipping remote trigger."
          fi

  deploy-admin:
    name: Deploy Admin Panel to Vercel (Staging)
    runs-on: ubuntu-latest
    needs: [validate]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Admin to Vercel (Preview/Staging)
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            pnpm dlx vercel --token ${{ secrets.VERCEL_TOKEN }} --cwd apps/admin
          else
            echo "VERCEL_TOKEN not configured; skipping Vercel CLI deploy."
          fi

